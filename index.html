<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1c130f">
<title>Gyoza Grand Prix</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: one-screen app — header bar, then a working area that is a single column on phones
   and "your plate" + live leaderboard side by side from 820px. Single dark look: a soy-sauce table. */
:root{
  --soy:#110f1c; --lacquer:rgba(28,25,44,.78); --lacquer-2:rgba(44,39,66,.85); --line:rgba(170,160,220,.18); --track:rgba(12,11,24,.7); --hi:rgba(242,169,59,.16);
  --rice:#f7ecdf; --muted:#b8b0cc; --crust:#f2a93b; --crust-deep:#c97a1c;
  --scallion:#86c96f; --chili:#e5503f;
  --display:"Dela Gothic One","Arial Black",system-ui,sans-serif;
  --body:"Zen Kaku Gothic New",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:18px;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--soy);color:var(--rice);font-family:var(--body);font-size:16px;line-height:1.45;
  background-attachment:fixed}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--crust);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding-block:14px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0}
.brand svg{width:46px;height:38px}
.brand b{font-family:var(--display);font-weight:400;font-size:1.45rem;letter-spacing:.01em}
.brand small{display:block;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:left}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:5px 12px;font-size:.82rem;color:var(--muted);background:var(--lacquer)}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--scallion)}
.pill.off .dot{background:var(--muted)}
.pill.ended .dot{background:var(--chili)}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:clamp(1.7rem,4.6vw,2.6rem);line-height:1.1}
h2{font-size:1.25rem}
.eyebrow{font-size:.74rem;letter-spacing:.16em;text-transform:uppercase;color:var(--crust);font-weight:700}
.sub{color:var(--muted);margin:6px 0 0;max-width:60ch}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:99px;border:1px solid var(--line);background:var(--lacquer-2);padding:10px 18px;font-weight:700;min-height:44px}
.btn:hover{border-color:var(--crust)}
.btn.primary{background:var(--crust);border-color:var(--crust);color:#2a1606}
.btn.primary:hover{background:#ffb84d}
.btn.danger{border-color:var(--chili);color:#ffb3a8}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.screen{animation:in .25s ease}
.table{display:grid;gap:18px;grid-template-columns:1fr}
@media (min-width:900px){.table{grid-template-columns:minmax(0,1fr) 300px}}
.seats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.seat{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 10px;border-radius:var(--r);border:1px solid var(--line);background:var(--lacquer);min-width:0}
.seat.lead{border-color:var(--crust)}
.seat .av{width:70px}
.seat .nm{font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seat .num{font-family:var(--display);font-size:2.4rem;line-height:1;color:var(--crust);font-variant-numeric:tabular-nums}
.seat .tap{width:100%;min-height:58px;border-radius:14px;border:0;background:var(--crust);color:#2a1606;font-family:var(--display);font-size:1.15rem;box-shadow:0 5px 0 #7a4512;transition:transform .08s,box-shadow .08s;touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none}
.seat .tap:active,.seat .tap.pressed{transform:translateY(4px);box-shadow:0 1px 0 #7a4512}
.seat .tap[disabled]{filter:grayscale(.7);opacity:.55}
.seat .untap{background:none;border:0;color:var(--muted);font-size:.85rem;text-decoration:underline;min-height:32px}
.seat .untap[disabled]{opacity:.35}
.seat .crown{position:absolute;top:8px;right:10px;font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;background:var(--crust);color:#2a1606;border-radius:99px;padding:2px 7px;font-weight:700}
@keyframes in{from{transform:translateY(6px)}to{transform:none}}

/* lobby */
.lobby-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 10px 12px;border-radius:var(--r);border:1px solid var(--line);background:var(--lacquer);text-align:center}
.tile:hover{border-color:var(--crust);transform:translateY(-2px)}
.tile{transition:transform .15s,border-color .15s}
.tile .nm{font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .ct{font-family:var(--display);color:var(--crust);font-size:1.05rem}
.tile.add{border-style:dashed;justify-content:center;min-height:170px;color:var(--muted)}
.tile.add .plus{font-family:var(--display);font-size:2.2rem;color:var(--crust);line-height:1}
.tile .me{position:absolute;top:8px;left:8px;font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;background:var(--scallion);color:#14240c;border-radius:99px;padding:2px 7px;font-weight:700}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:34px 16px;border:1px dashed var(--line);border-radius:var(--r);background:var(--lacquer)}
.empty svg{width:150px;height:125px}

/* avatar */
.av{position:relative;flex:none}
.av .ph{position:absolute;right:-4px;bottom:-4px;width:42%;aspect-ratio:1;border-radius:50%;object-fit:cover;border:3px solid var(--soy);background:var(--lacquer-2)}
.av.photo-main .ph{position:static;width:100%;height:100%;border:0}
.av.photo-main .mini{position:absolute;right:-8px;bottom:-6px;width:58%}
.av svg{display:block;width:100%;height:auto}

/* editor */
.editor{display:grid;gap:22px;grid-template-columns:1fr}
@media (min-width:820px){.editor{grid-template-columns:320px 1fr}}
.stage{background:var(--lacquer);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;align-items:center;gap:14px;align-self:start}
.stage .av{width:210px}
.plate{width:240px;height:22px;border-radius:50%;background:radial-gradient(ellipse at center,rgba(255,255,255,.12) 0,transparent 70%);margin-top:-18px}
.field{display:flex;flex-direction:column;gap:8px}
.field label,.field .lbl{font-weight:700;font-size:.9rem}
.field input[type=text]{background:var(--lacquer);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:1.05rem;width:100%}
.field input[type=text]:focus{border-color:var(--crust);outline:none}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:1px solid var(--line);background:var(--lacquer);border-radius:12px;padding:6px 10px;display:flex;align-items:center;gap:8px;min-height:44px}
.opt[aria-pressed=true]{border-color:var(--crust);background:var(--hi);box-shadow:inset 0 0 0 1px var(--crust)}
.swatch{width:22px;height:22px;border-radius:50%;border:2px solid rgba(255,255,255,.25)}
.opt .mini{width:40px}
.photo-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.photo-prev{width:64px;height:64px;border-radius:50%;object-fit:cover;border:2px solid var(--line);background:var(--lacquer)}
.photo-empty{width:64px;height:64px;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;color:var(--muted);font-size:.75rem}
.fileinput{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.form{display:flex;flex-direction:column;gap:20px;min-width:0}

/* play */
.play{display:grid;gap:18px;grid-template-columns:1fr}
@media (min-width:820px){.play{grid-template-columns:minmax(0,1fr) 340px}}
.me-card{background:var(--lacquer);border:1px solid var(--line);border-radius:22px;padding:20px;display:flex;flex-direction:column;align-items:center;gap:14px;min-width:0;position:relative;overflow:hidden}
.me-top{display:flex;align-items:center;gap:14px;width:100%}
.me-top .av{width:78px}
.me-top .who{min-width:0}
.me-top .who b{display:block;font-family:var(--display);font-weight:400;font-size:1.4rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me-top .who span{color:var(--muted);font-size:.9rem}
.big-count{font-family:var(--display);font-size:clamp(4.5rem,18vw,7.5rem);line-height:.9;color:var(--crust);font-variant-numeric:tabular-nums;text-shadow:0 6px 0 #5a3412}
.big-label{color:var(--muted);font-size:.85rem;letter-spacing:.14em;text-transform:uppercase;margin-top:-6px}
.eat{position:relative;width:min(260px,72vw);aspect-ratio:1;border-radius:50%;border:0;background:radial-gradient(circle at 50% 38%,#ffcf7a 0,var(--crust) 48%,var(--crust-deep) 100%);box-shadow:0 10px 0 #7a4512,0 18px 30px rgba(0,0,0,.45);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#2a1606;transition:transform .08s,box-shadow .08s;-webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none}
.eat:active,.eat.pressed{transform:translateY(8px);box-shadow:0 2px 0 #7a4512,0 8px 16px rgba(0,0,0,.45)}
.eat svg{width:56%}
.eat b{font-family:var(--display);font-weight:400;font-size:1.15rem;margin-top:2px}
.eat small{font-weight:700;font-size:.8rem;opacity:.75}
.eat[disabled]{filter:grayscale(.7);opacity:.6}
.floater{position:absolute;font-family:var(--display);color:var(--scallion);font-size:2rem;pointer-events:none;animation:float .9s ease-out forwards}
@keyframes float{from{opacity:1;transform:translate(-50%,0) scale(.8)}to{opacity:0;transform:translate(-50%,-110px) scale(1.25)}}
.notice{width:100%;border-radius:12px;padding:10px 12px;background:#3a1d18;border:1px solid var(--chili);color:#ffcfc7;font-size:.9rem}
.notice.info{background:#22301c;border-color:var(--scallion);color:#d8f2cc}

.board{background:var(--lacquer);border:1px solid var(--line);border-radius:22px;padding:16px;align-self:start;min-width:0}
.board-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.live{display:inline-flex;align-items:center;gap:6px;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--scallion);font-weight:700}
.live i{width:8px;height:8px;border-radius:50%;background:var(--scallion);animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.3}}
.rank{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.rank li{display:grid;grid-template-columns:28px 40px minmax(0,1fr) auto;align-items:center;gap:10px;padding:6px 8px;border-radius:12px;transition:background .2s}
.rank li.you{background:var(--hi)}
.rank .pos{font-family:var(--display);color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.rank li:nth-child(1) .pos{color:var(--crust)}
.rank .av{width:40px}
.rank .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank .bar{height:6px;border-radius:6px;background:var(--line);margin-top:4px;overflow:hidden}
.rank .bar span{display:block;height:100%;background:var(--crust);border-radius:6px;transition:width .4s ease}
.rank .n{font-family:var(--display);font-size:1.15rem;font-variant-numeric:tabular-nums;min-width:2ch;text-align:right}
.board-foot{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);display:flex;justify-content:space-between;color:var(--muted);font-size:.85rem;gap:8px;flex-wrap:wrap}
.board-foot b{color:var(--rice);font-variant-numeric:tabular-nums}

/* finale */
.finale-head{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;margin-bottom:22px}
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;align-items:end;max-width:640px;margin:0 auto 22px}
.step{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.step .av{width:min(110px,26vw)}
.step .nm{font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.step .block{width:100%;border-radius:14px 14px 4px 4px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:10px;font-family:var(--display);background:var(--lacquer-2);border:1px solid var(--line)}
.step .block .p{font-size:1.8rem;line-height:1}
.step .block .c{font-size:.95rem;color:var(--muted);font-family:var(--body);font-weight:700}
.step.s1 .block{height:150px;background:linear-gradient(var(--crust),var(--crust-deep));color:#2a1606;border:0}
.step.s1 .block .c{color:#3d220a}
.step.s2 .block{height:110px}
.step.s3 .block{height:84px}
.step.blank{visibility:hidden}
.awards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;max-width:760px;margin:0 auto 22px}
.award{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;background:var(--lacquer)}
.award .av{width:56px}
.award .k{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--crust);font-weight:700}
.award b{display:block}
.award span{color:var(--muted);font-size:.88rem}
.finale-list{max-width:640px;margin:0 auto 22px;background:var(--lacquer);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.confirm{max-width:640px;margin:0 auto;border:1px solid var(--chili);border-radius:var(--r);padding:14px;background:#2e1713;display:flex;flex-direction:column;gap:10px}
.center{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--rice);color:var(--soy);padding:10px 16px;border-radius:99px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.4);z-index:20;max-width:calc(100% - 32px);text-align:center}

.sound{border:1px solid var(--line);background:var(--lacquer);border-radius:99px;padding:6px 12px;font-size:.82rem;color:var(--muted);min-height:36px}
.sound[aria-pressed=true]{color:var(--crust);border-color:var(--crust-deep)}
.timer{font-size:.78rem;color:var(--scallion);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.podium-list li.big{grid-template-columns:30px 42px minmax(0,1fr) auto;padding:7px 8px}
.podium-list li.big .av{width:42px}
.podium-list li.big .nm{font-size:1.02rem}
.podium-list li.big .n{font-size:1.45rem}
.podium-list li.p1{background:linear-gradient(90deg,rgba(242,169,59,.28),rgba(242,169,59,.06))}
.podium-list li.p1 .pos{color:var(--crust)}
.podium-list li.p2 .pos{color:#d9d4cf}
.podium-list li.p3 .pos{color:#d58b52}
.rank .tu{color:var(--scallion);font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;margin-left:4px}
.rank li.gap{display:block;text-align:center;color:var(--muted);padding:0;line-height:1}
.more{width:100%;margin-top:8px;background:transparent;border:1px dashed var(--line);border-radius:12px;padding:9px;color:var(--muted);font-weight:700;font-size:.88rem;min-height:42px}
.more:hover{border-color:var(--crust);color:var(--rice)}
.menu-btn{margin-left:auto;flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--lacquer-2);font-size:1.4rem;line-height:1;color:var(--rice)}
.menu{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px;border:1px solid var(--line);border-radius:14px;background:var(--soy)}
.menu .btn{min-height:44px;font-size:.88rem;padding:8px 10px}
.hud .me-card{padding:18px 16px 20px;gap:16px}
.eat-row{gap:clamp(24px,8vw,48px);padding-block:4px}
.count-box{gap:10px}
.big-label{margin-top:0}
.btn.undo{margin-top:4px}
.fx{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:rgba(10,9,22,.8);padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow:hidden;animation:fxin .25s ease}
@keyframes fxin{from{opacity:0}to{opacity:1}}
.rain{position:absolute;inset:0;pointer-events:none}
.drop{position:absolute;top:-80px;width:56px;animation:fall 2s linear infinite}
@keyframes fall{to{transform:translateY(115vh) rotate(320deg)}}
.fx-card{position:relative;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;background:var(--lacquer);border:2px solid var(--crust);border-radius:24px;padding:22px 20px;max-width:360px;width:100%;animation:boom .55s cubic-bezier(.2,1.6,.4,1)}
@keyframes boom{from{transform:scale(.4) rotate(-6deg)}to{transform:none}}
.fx-theme{margin:0;font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--scallion);font-weight:700}
.fx-diag{margin:0;font-size:.85rem;background:var(--soy);border:1px solid var(--line);border-radius:10px;padding:8px 10px;color:var(--rice)}
.fx-k{margin:0;font-family:var(--display);font-size:clamp(2.4rem,12vw,3.4rem);color:var(--crust);line-height:1;text-shadow:0 5px 0 #5a3412;animation:wob .5s ease-in-out 3}
@keyframes wob{50%{transform:scale(1.08) rotate(-2deg)}}
.fx-duel{display:flex;align-items:center;gap:12px}
.fx-duel .av{width:84px}
.fx-duel .av:last-child{width:64px;opacity:.6;filter:grayscale(.5)}
.fx-arrow{font-family:var(--display);font-size:2.4rem;color:var(--scallion)}
.fx-t{margin:0;font-size:1.1rem}
.fx-s{margin:0;color:var(--muted)}

.invite-top{min-height:38px;padding:6px 14px;font-size:.85rem}
.head-r{display:flex;align-items:center;gap:8px}
.btn.tiny{min-height:32px;padding:4px 10px;font-size:.78rem;border-color:var(--crust-deep);color:var(--crust)}
.board-head h2{font-size:1.05rem}
/* race */
.race{display:flex;flex-direction:column;gap:4px;width:100%;background:none;border:0;padding:0;text-align:left;color:inherit}
.lane{display:grid;grid-template-columns:20px minmax(0,1fr) 34px;align-items:center;gap:6px}
.lane .pos{font-family:var(--display);color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.lane.p1 .pos{color:var(--crust)} .lane.p2 .pos{color:#d9d4cf} .lane.p3 .pos{color:#d58b52}
.lane .n{font-family:var(--display);font-size:1.15rem;text-align:right;font-variant-numeric:tabular-nums}
.track{position:relative;height:40px;border-radius:10px;background:repeating-linear-gradient(90deg,transparent 0 18px,rgba(247,236,223,.06) 18px 20px),var(--track);border:1px solid var(--line);overflow:hidden}
.lane.you .track{border-color:var(--scallion)}
.finish{position:absolute;right:0;top:0;bottom:0;width:8px;background:repeating-conic-gradient(#f7ecdf 0 25%,#1c130f 0 50%) 0 0/8px 8px;opacity:.55}
.runner{position:absolute;bottom:1px;width:40px;transition:left .8s cubic-bezier(.3,1.3,.5,1);display:flex;align-items:flex-end}
.runner svg{width:40px;height:auto;flex:none}
.runner .rn{position:absolute;left:44px;bottom:12px;white-space:nowrap;font-size:.74rem;font-weight:700;color:var(--rice);text-shadow:0 1px 2px #000}
.runner.lbl-left .rn{left:auto;right:44px}
.race-hint{display:block;text-align:center;font-size:.78rem;color:var(--muted);font-weight:700;padding:6px 0 0}
.full-list{margin-top:8px;border-top:1px solid var(--line);padding-top:8px}
.board.compact .rank.full-list li{grid-template-columns:24px 32px minmax(0,1fr) auto 30px;gap:8px;padding:5px 6px}
.board.compact .rank.full-list li .av{width:32px}
.full-list li.p1{background:linear-gradient(90deg,rgba(242,169,59,.25),transparent)}
.full-list .gapn{color:var(--muted);font-size:.8rem;font-variant-numeric:tabular-nums}
/* running animation */
svg.running .body{animation:bob .32s ease-in-out infinite alternate}
svg.running .leg{transform-box:fill-box;transform-origin:50% 0}
svg.running .leg.l{animation:stride .32s ease-in-out infinite alternate}
svg.running .leg.r{animation:stride .32s ease-in-out infinite alternate-reverse}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-4px)}}
@keyframes stride{from{transform:rotate(28deg)}to{transform:rotate(-28deg)}}
.prop{transform-box:fill-box;transform-origin:50% 50%;animation:spin .5s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* overtake scene */
.fx-track{position:relative;width:100%;height:96px;border-radius:14px;background:repeating-linear-gradient(90deg,transparent 0 22px,rgba(247,236,223,.06) 22px 24px),var(--track);border:1px solid var(--line);overflow:hidden}
.fx-line{position:absolute;left:0;right:0;top:50%;border-top:2px dashed rgba(247,236,223,.18)}
.fx-run{position:absolute;width:64px;display:flex;flex-direction:column;align-items:center}
.fx-run svg{width:64px;height:auto}
.fx-run span{font-size:.7rem;font-weight:700;white-space:nowrap}
.fx-b{top:4px;left:42%;animation:runB 2.6s ease-out forwards}
.fx-a{top:34px;left:6%;animation:runA 2.6s cubic-bezier(.4,0,.2,1) forwards;z-index:2}
@keyframes runB{to{left:48%}}
@keyframes runA{0%{left:4%}60%{left:46%}100%{left:72%}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.hud{display:grid;gap:12px;grid-template-columns:1fr}
.hud .board{order:2}
@media (min-width:820px){.hud{grid-template-columns:minmax(0,1fr) 340px}.hud .board{order:2}}
.board.compact{padding:12px 14px}
.board.compact .board-head{margin-bottom:6px}
.board-scroll{max-height:34vh;overflow-y:auto;overscroll-behavior:contain}
@media (min-width:820px){.board-scroll{max-height:70vh}}
.board.compact .rank{gap:2px}
.board.compact .rank li{grid-template-columns:22px 30px minmax(0,1fr) auto;padding:4px 6px;gap:8px}
.board.compact .rank .av{width:30px}
.board.compact .board-foot{margin-top:6px;padding-top:6px}
.hud .me-card{padding:14px;gap:10px}
.hud .me-top .av{width:52px}
.hud .me-top .who b{font-size:1.15rem}
.eat-row{display:flex;align-items:center;justify-content:center;gap:clamp(14px,5vw,40px);width:100%}
.count-box{display:flex;flex-direction:column;align-items:center}
.hud .big-count{font-size:clamp(3.6rem,15vw,6rem)}
.hud .eat{width:min(170px,44vw)}
.hud .eat b{font-size:1.6rem}
.btn.undo{width:100%;max-width:360px;background:var(--hi);border-color:var(--crust);color:var(--rice);min-height:50px}
.small-acts{justify-content:center}
.small-acts .btn{min-height:38px;padding:6px 12px;font-size:.85rem}
.table .board{order:-1}
@media (min-width:900px){.table .board{order:2}}
.table .board-scroll{max-height:30vh}
.invite{margin-top:18px;display:flex;flex-direction:column;gap:12px;border:1px solid var(--line);border-radius:var(--r);padding:16px;background:var(--lacquer)}
.linkbox{width:100%;margin-top:10px;background:var(--soy);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:.85rem;color:var(--muted)}
.setup{max-width:640px}
#dburl{background:var(--lacquer);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:1rem;width:100%}
#dburl:focus{border-color:var(--crust);outline:none}
.bokeh{position:fixed;inset:-80px;z-index:-1;pointer-events:none;filter:blur(60px) saturate(1.3);opacity:.38}
.bokeh svg{width:100%;height:100%}
.board,.me-card,.tile,.stage,.invite,.empty,.award,.finale-list,.seat,.fx-card{backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
</style>

<div class="wrap">

      <span id="brandIcon"></span>
      <span><b>Gyoza Grand Prix</b><small>Chi ne mangia di più?</small></span>
    </button>
    <button class="btn invite-top" data-act="invite">Invita amici</button>
  </header>
  <main id="app"></main>
</div>
<div class="fx" id="fx" hidden></div>
<div class="toast" id="toast" hidden></div>

<script>
const MAX = 10;
const DOUGH = [
  {k:'classico',n:'Classico',c:'#f3e2c2',s:'#d9bf93'},

  {k:'cielo',n:'Fiore blu',c:'#93c6f0',s:'#6a9fd0'},

const FACES = [
  {k:'felice',n:'Felice'},{k:'affamato',n:'Affamato'},{k:'cool',n:'Cool'},
  {k:'innamorato',n:'Innamorato'},{k:'assonnato',n:'Pieno'},

  {k:'corona',n:'Corona'},{k:'bacchette',n:'Bacchette'},{k:'fiocco',n:'Fiocco'},
  {k:'casco',n:'Casco da corsa'},{k:'cuffie',n:'Cuffie'},{k:'cowboy',n:'Cowboy'},{k:'berretto',n:'Berretto'},

  {k:'oro',n:'Oro',c:'#f2c335'},{k:'rosa',n:'Rosa',c:'#f07ab8'},{k:'nero',n:'Nere',c:'#26222a'},{k:'bianco',n:'Bianche',c:'#f4f1ec'},{k:'arancio',n:'Arancio',c:'#f28c28'}
];

/* ---------- character drawing ---------- */
function gyozaSVG(o={}){
  const d = DOUGH.find(x=>x.k===o.dough)||DOUGH[0];
  const dark = d.k==='seppia';
  const ink = dark ? '#f7ecdf' : '#2a1a12';
  const face = o.face||'felice', acc=o.acc||'nessuno';
  let f='';
  const cheeks = `<ellipse cx="40" cy="71" rx="6" ry="3.5" fill="#ff7a6b" opacity=".45"/><ellipse cx="80" cy="71" rx="6" ry="3.5" fill="#ff7a6b" opacity=".45"/>`;
  if(face==='felice') f=`<circle cx="47" cy="63" r="4" fill="${ink}"/><circle cx="73" cy="63" r="4" fill="${ink}"/><path d="M53 71 Q60 78 67 71" stroke="${ink}" stroke-width="3" fill="none" stroke-linecap="round"/>`+cheeks;
  if(face==='affamato') f=`<circle cx="47" cy="62" r="4.5" fill="${ink}"/><circle cx="73" cy="62" r="4.5" fill="${ink}"/><circle cx="48.5" cy="60.5" r="1.4" fill="#fff"/><circle cx="74.5" cy="60.5" r="1.4" fill="#fff"/><path d="M52 69 Q60 82 68 69 Z" fill="${ink}"/><path d="M56 74 Q60 79 64 74 Z" fill="#ff7a6b"/>`+cheeks;
  if(face==='cool') f=`<path d="M38 58 H82 V62 Q80 70 72 70 Q65 70 63 62 H57 Q55 70 48 70 Q40 70 38 62 Z" fill="#1a1a1f"/><path d="M42 61 l6 0" stroke="#fff" stroke-width="1.6" opacity=".6"/><path d="M54 75 Q61 78 67 73" stroke="${ink}" stroke-width="3" fill="none" stroke-linecap="round"/>`;
  if(face==='innamorato') f=`<path d="M47 67 l-5 -5 a3 3 0 0 1 5 -3 a3 3 0 0 1 5 3 z" fill="#e5503f"/><path d="M73 67 l-5 -5 a3 3 0 0 1 5 -3 a3 3 0 0 1 5 3 z" fill="#e5503f"/><path d="M54 72 Q60 77 66 72" stroke="${ink}" stroke-width="3" fill="none" stroke-linecap="round"/>`+cheeks;
  if(face==='assonnato') f=`<path d="M42 63 Q47 67 52 63" stroke="${ink}" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M68 63 Q73 67 78 63" stroke="${ink}" stroke-width="3" fill="none" stroke-linecap="round"/><ellipse cx="60" cy="74" rx="3.5" ry="3" fill="${ink}"/>`+cheeks;
  if(face==='occhiolino') f=`<circle cx="47" cy="63" r="4" fill="${ink}"/><path d="M68 64 Q73 60 78 64" stroke="${ink}" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M52 71 Q61 79 68 70" stroke="${ink}" stroke-width="3" fill="none" stroke-linecap="round"/>`+cheeks;
  if(face==='stupito') f=`<circle cx="47" cy="61" r="5" fill="#fff"/><circle cx="73" cy="61" r="5" fill="#fff"/><circle cx="47" cy="62" r="2.6" fill="${ink}"/><circle cx="73" cy="62" r="2.6" fill="${ink}"/><ellipse cx="60" cy="75" rx="4" ry="5" fill="${ink}"/>`;
  if(face==='grinta') f=`<path d="M40 55 L52 59" stroke="${ink}" stroke-width="3" stroke-linecap="round"/><path d="M80 55 L68 59" stroke="${ink}" stroke-width="3" stroke-linecap="round"/><circle cx="47" cy="64" r="3.6" fill="${ink}"/><circle cx="73" cy="64" r="3.6" fill="${ink}"/><path d="M52 74 L68 74" stroke="${ink}" stroke-width="3" stroke-linecap="round"/><path d="M55 74 v3 M60 74 v3 M65 74 v3" stroke="${ink}" stroke-width="1.6"/>`;
  if(face==='linguaccia') f=`<path d="M42 63 Q47 59 52 63" stroke="${ink}" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M68 63 Q73 59 78 63" stroke="${ink}" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M51 70 Q60 75 69 70" stroke="${ink}" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M56 72 Q57 82 61 82 Q65 82 65 72 Z" fill="#ff6f86"/>`+cheeks;
  let a='', back='';
  if(acc==='chef') a=`<rect x="44" y="20" width="32" height="10" rx="2" fill="#fff" stroke="#ccc"/><circle cx="48" cy="14" r="9" fill="#fff"/><circle cx="60" cy="9" r="10" fill="#fff"/><circle cx="72" cy="14" r="9" fill="#fff"/><rect x="44" y="14" width="32" height="10" fill="#fff"/>`;
  if(acc==='hachimaki') a=`<path d="M24 46 Q60 26 96 46 L94 53 Q60 34 26 53 Z" fill="#fff"/><circle cx="60" cy="40" r="5" fill="#e5503f"/><path d="M95 48 l12 -6 l-2 9 z M95 50 l11 6 l-9 3 z" fill="#fff"/>`;
  if(acc==='corona') a=`<path d="M44 34 L46 16 L54 26 L60 12 L66 26 L74 16 L76 34 Z" fill="#f2c335" stroke="#b8861a" stroke-width="1.5" stroke-linejoin="round"/><circle cx="60" cy="27" r="2.6" fill="#e5503f"/>`;
  if(acc==='bacchette') back=`<rect x="70" y="2" width="5" height="70" rx="2.5" fill="#a5713d" transform="rotate(28 72 37)"/><rect x="80" y="4" width="5" height="70" rx="2.5" fill="#8a5a2c" transform="rotate(40 82 39)"/>`;
  if(acc==='casco') a=`<path d="M22 54 Q24 22 60 20 Q96 22 98 54 Q60 44 22 54 Z" fill="#e5503f"/><path d="M30 46 Q60 36 90 46" stroke="#fff" stroke-width="4" fill="none"/><path d="M58 20 h4 v28 h-4 z" fill="#fff" opacity=".85"/>`;
  if(acc==='cuffie') a=`<path d="M22 60 Q22 18 60 18 Q98 18 98 60" stroke="#2c2b31" stroke-width="5" fill="none"/><rect x="14" y="52" width="14" height="22" rx="6" fill="#3f7be5"/><rect x="92" y="52" width="14" height="22" rx="6" fill="#3f7be5"/>`;
  if(acc==='cowboy') a=`<ellipse cx="60" cy="33" rx="40" ry="7" fill="#9a6232"/><path d="M42 33 Q42 10 60 12 Q78 10 78 33 Z" fill="#b5763d"/><path d="M42 28 h36 v4 h-36 z" fill="#5a3412"/>`;
  if(acc==='berretto') a=`<path d="M36 36 Q38 16 62 16 Q84 18 84 36 Z" fill="#3f7be5"/><path d="M80 33 Q98 32 104 38 Q92 40 80 38 Z" fill="#2d5fb8"/><circle cx="61" cy="16" r="3" fill="#2d5fb8"/>`;
  if(acc==='baffi') a=`<path d="M60 70 Q50 64 40 70 Q46 76 52 73 Q57 71 60 72 Q63 71 68 73 Q74 76 80 70 Q70 64 60 70 Z" fill="#3a2418"/>`;
  if(acc==='aureola') a=`<ellipse cx="60" cy="14" rx="22" ry="6" fill="none" stroke="#f2c335" stroke-width="4"/>`;
  if(acc==='corna') a=`<path d="M38 36 Q32 18 40 10 Q42 24 48 32 Z" fill="#e5503f"/><path d="M82 36 Q88 18 80 10 Q78 24 72 32 Z" fill="#e5503f"/>`;
  if(acc==='girandola') a=`<path d="M48 30 Q48 16 60 16 Q72 16 72 30 Z" fill="#f2c335"/><path d="M60 16 v-6" stroke="#2c2b31" stroke-width="2"/><g class="prop"><ellipse cx="51" cy="9" rx="9" ry="2.6" fill="#e5503f"/><ellipse cx="69" cy="9" rx="9" ry="2.6" fill="#3f7be5"/></g>`;
  if(acc==='fiocco') a=`<path d="M60 30 L44 20 Q40 30 44 40 Z M60 30 L76 20 Q80 30 76 40 Z" fill="#e5503f"/><circle cx="60" cy="30" r="5" fill="#b8352a"/>`;
  const sh=(SHOES.find(x=>x.k===o.shoes)||SHOES[0]).c;
  const legs = o.run ? `<g class="leg l"><path d="M46 86 L42 106" stroke="${d.s}" stroke-width="6" stroke-linecap="round"/><ellipse cx="39" cy="108" rx="9" ry="5" fill="${sh}" stroke="#0003"/></g>
    <g class="leg r"><path d="M74 86 L78 106" stroke="${d.s}" stroke-width="6" stroke-linecap="round"/><ellipse cx="81" cy="108" rx="9" ry="5" fill="${sh}" stroke="#0003"/></g>` : '';
  return `<svg viewBox="0 0 120 ${o.run?116:100}" class="${o.run?'running':''}" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">${back}${legs}
  ${o.run?'':'<ellipse cx="60" cy="92" rx="44" ry="5" fill="#000" opacity=".25"/>'}
  <g class="body"><path d="M8 80 Q14 30 60 28 Q106 30 112 80 Q60 96 8 80 Z" fill="${d.c}"/>
  <path d="M8 80 Q60 96 112 80 Q108 88 60 92 Q12 88 8 80 Z" fill="#c9792a"/>
  <path d="M10 80 Q60 93 110 80" stroke="#9c5418" stroke-width="2" fill="none" opacity=".6"/>
  <g fill="none" stroke="${d.s}" stroke-width="2.6" stroke-linecap="round">
    <path d="M30 38 Q34 46 33 52"/><path d="M42 32 Q45 41 44 48"/><path d="M54 29 Q56 38 56 45"/><path d="M66 29 Q65 38 64 45"/><path d="M78 32 Q75 41 76 48"/><path d="M90 38 Q86 46 87 52"/>
  </g>
  <path d="M14 66 Q16 44 30 38" stroke="#fff" stroke-width="3" fill="none" opacity=".35" stroke-linecap="round"/>
  ${f}${a}</g></svg>`;
}
function runnerSVG(p){ return gyozaSVG({...p, run:true}); }
function avatarHTML(p, cls=''){
  if(!p) return '';
  const svg = gyozaSVG(p);
  if(p.photo) return `<div class="av photo-main ${cls}"><img class="ph" src="${p.photo}" alt=""><div class="mini">${svg}</div></div>`;
  return `<div class="av ${cls}">${svg}</div>`;
}
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- state + storage (Firebase Realtime Database) ---------- */
const S = {players:{}, bites:{}, game:{ended:false}, mode:'loading', canWrite:true, online:true, err:''};
const ls = {get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function roomCode(){ const c='abcdefghjkmnpqrstuvwxyz23456789'; let r=''; for(let i=0;i<7;i++) r+=c[Math.floor(Math.random()*c.length)]; return r; }
function parseHash(){ const h=new URLSearchParams(location.hash.slice(1)); const db=h.get('db'), r=h.get('r'); return db&&r?{db,r}:null; }
const DEFAULT_DB='https://coppa-gyoza-default-rtdb.europe-west1.firebasedatabase.app';
let CONN = parseHash() || {db:DEFAULT_DB, r:'serata'};
const meKey = ()=>'gyoza.me.'+(CONN?CONN.r:'');
let me = CONN? ls.get(meKey(),null) : null;
const setMe = id=>{ me=id; ls.set(meKey(),id); };
let view = {name:'lobby', editId:null, draft:null, confirmReset:false};
let FB=null, ROOM=null;
function shareLink(){ if(CONN.db===DEFAULT_DB && CONN.r==='serata') return location.origin+location.pathname; return location.origin+location.pathname+'#db='+encodeURIComponent(CONN.db)+'&r='+CONN.r; }
function normalizeDb(u){
  u=(u||'').trim().replace(/\/+$/,'');
  if(!/^https:\/\/[a-z0-9-]+(\.[a-z0-9-]+)*\.(firebasedatabase\.app|firebaseio\.com)$/i.test(u)) return null;
  return u;
}
function fail(e){
  console.warn(e);
  S.mode='error';
  S.err = (e&&e.code==='PERMISSION_DENIED') ? 'Il database ha rifiutato l\'accesso. In Firebase apri Realtime Database › Regole e controlla che lettura e scrittura siano consentite (modalità di test).' : 'Non riesco a collegarmi al database. Controlla l\'indirizzo e la connessione, poi ricarica.';
  render();
}
function connect(){
  if(!CONN){ S.mode='setup'; render(); return; }
  if(!window.firebase){ S.mode='error'; S.err='Non riesco a caricare Firebase. Controlla la connessione e ricarica la pagina.'; render(); return; }
  ls.set('gyoza.conn',CONN);
  try{ history.replaceState(null,'',shareLink()); }catch{}
  me = ls.get(meKey(),null);
  try{
    const app = firebase.apps.length ? firebase.app() : firebase.initializeApp({databaseURL:CONN.db});
    FB = firebase.database(app);
  }catch(e){ fail(e); return; }
  ROOM = FB.ref('rooms/'+CONN.r);
  S.mode='loading'; render();
  let first=true;
  ROOM.child('players').on('value', s=>{ S.players=s.val()||{}; if(first){ first=false; S.mode='db'; if(me && S.players[me]) view={name:'play'}; } render(); }, fail);
  ROOM.child('bites').on('value', s=>{ S.bites=s.val()||{}; checkOvertakes(); prepareClip(); if(S.mode==='db') render(); }, fail);
  ROOM.child('game').on('value', s=>{ S.game=s.val()||{ended:false}; if(S.mode==='db') render(); }, fail);
  FB.ref('.info/connected').on('value', s=>{ S.online=!!s.val(); status(); });
  // remote "update now": when app/reload changes, every open phone reloads with the latest version and sound list
  let reloadBase;
  FB.ref('app/reload').on('value', s=>{ const v=s.val(); if(reloadBase===undefined){ reloadBase=v; return; } if(v!==reloadBase){ ls.set('gyoza.clips2',{at:0,list:[]}); location.reload(); } });
}
async function write(fn){
  try{ await fn(); return true; }
  catch(e){ console.warn(e); toast(e&&e.code==='PERMISSION_DENIED'?'Il database ha rifiutato la modifica: controlla le regole in Firebase':'Non sono riuscito a salvare. Riprova.'); return false; }
}
function putPlayer(id,data){ return write(()=>ROOM.child('players/'+id).set(data)); }
function addBite(pid){ return write(()=>ROOM.child('bites').push({p:pid,t:firebase.database.ServerValue.TIMESTAMP})); }
function undoBite(pid){
  const mine = Object.entries(S.bites).filter(([,b])=>b.p===pid).sort((a,b)=>(b[1].t||0)-(a[1].t||0));
  if(!mine.length) return;
  return write(()=>ROOM.child('bites/'+mine[0][0]).remove());
}
function setGame(g){ return write(()=>ROOM.child('game').set(g)); }
async function resetAll(){
  await write(()=>ROOM.remove());
  setMe(null); view={name:'lobby'}; render();
}
function leaveRoom(){
  if(ROOM){ ROOM.child('players').off(); ROOM.child('bites').off(); ROOM.child('game').off(); }
  CONN=null; ls.set('gyoza.conn',null); me=null;
  try{ history.replaceState(null,'',location.pathname); }catch{}
  S.players={};S.bites={};S.game={ended:false}; S.mode='setup'; view={name:'lobby'}; render();
}

/* ---------- derived ---------- */
function counts(){ const c={}; for(const id in S.players) c[id]=0; for(const k in S.bites){ const p=S.bites[k].p; if(p in c) c[p]++; } return c; }
function ranking(){
  const c=counts();
  const list = Object.entries(S.players).map(([id,p])=>({id,...p,n:c[id]||0}))
    .sort((a,b)=> b.n-a.n || (a.createdAt||0)-(b.createdAt||0));
  let pos=0,prev=null; list.forEach((r,i)=>{ if(r.n!==prev){pos=i+1;prev=r.n;} r.pos=pos; });
  return list;
}

/* ---------- UI helpers ---------- */
let toastT;
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,2600); }
function go(name,extra={}){ view={name,...extra}; render(); window.scrollTo({top:0}); }
function status(){}
const UI={full:false};
function raceHTML(highlight, limit=5){
  const r=ranking();
  if(!r.length) return `<p class="sub">La gara parte appena entra il primo giocatore.</p>`;
  const max=Math.max(1,r[0].n);
  let lanes=r.slice(0,limit); const mine=r.find(x=>x.id===highlight);
  if(mine && !lanes.includes(mine)) lanes=[...lanes.slice(0,limit-1),mine];

  const h=Math.floor(sec/3600), m=Math.floor(sec/60)%60, x=sec%60, pad=v=>String(v).padStart(2,'0');
  return '⏱ '+(h?h+':'+pad(m):m)+':'+pad(x);
}

/* ---------- sorpassi: animation for everyone, sound on the overtaker's phone ---------- */
const FX_MIN=10, FX_MS=12000;
let prevCounts=null, fxQueue=[], fxBusy=false, AC=null, MASTER=null;
function unlockAudio(){
  try{
    if(!AC){ const C=window.AudioContext||window.webkitAudioContext; if(C){ AC=new C(); MASTER=AC.createDynamicsCompressor(); MASTER.connect(AC.destination); } }
    if(AC&&AC.state==='suspended') AC.resume();
    if(window.speechSynthesis && !unlockAudio.spoke){ const u=new SpeechSynthesisUtterance(' '); u.volume=0; speechSynthesis.speak(u); unlockAudio.spoke=true; }
  }catch{}
}
['pointerdown','touchend','click'].forEach(ev=>document.addEventListener(ev, unlockAudio, {passive:true, capture:true}));

/* ---------- clip audio dalla cartella suoni/ del repository ---------- */
const REPO = (()=>{ const own=location.hostname.endsWith('.github.io')?location.hostname.split('.')[0]:'matteomangiarotti';
  const name=location.pathname.split('/').filter(Boolean)[0]||'coppa-gyoza'; return {own,name}; })();
const CLIP_EXT=/\.(mp4|m4v|mov|webm|mp3|m4a|aac|wav|ogg|oga)$/i;
let CLIPS = ls.get('gyoza.clips2',{at:0,list:[]}).list;
const CLIP = new Audio(); CLIP.preload='none';
const SILENT='data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=';
let clipUnlocked=false, clipReady=null;
function unlockClip(){ if(clipUnlocked) return; clipUnlocked=true; try{ CLIP.src=SILENT; const p=CLIP.play(); p&&p.catch(()=>{}); }catch{} }
['touchend','click'].forEach(ev=>document.addEventListener(ev, unlockClip, {passive:true, capture:true}));
async function loadClips(force){
  const cached=ls.get('gyoza.clips2',{at:0,list:[]});
  // reuse a recent non-empty list; an empty list is always re-checked
  if(!force && cached.list.length && Date.now()-cached.at < 5*60*1000){ CLIPS=cached.list; return; }
  try{
    const r=await fetch(`https://api.github.com/repos/${REPO.own}/${REPO.name}/contents/suoni?ref=main`,{headers:{Accept:'application/vnd.github+json'}});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const items=await r.json();
    CLIPS=items.filter(x=>x.type==='file' && CLIP_EXT.test(x.name)).map(x=>'suoni/'+encodeURIComponent(x.name));
    ls.set('gyoza.clips2',{at:Date.now(),list:CLIPS});
  }catch(e){
    console.warn('clip list via API',e);
    try{ const r=await fetch('suoni/elenco.json?t='+Date.now(),{cache:'no-store'}); const names=await r.json();
      CLIPS=names.filter(n=>CLIP_EXT.test(n)).map(n=>'suoni/'+encodeURIComponent(n)); ls.set('gyoza.clips2',{at:Date.now(),list:CLIPS}); CLIPS.source='elenco'; }
    catch(e2){ console.warn('clip list via elenco',e2); CLIPS=cached.list||[]; }
  }
}
loadClips();
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) loadClips(); });
// shuffle bag: every clip once in random order, then a new random order (never the same clip twice in a row)
function nextClip(){
  if(!CLIPS.length) return null;
  let bag=ls.get('gyoza.bag',[]).filter(c=>CLIPS.includes(c));
  if(!bag.length){
    bag=[...CLIPS]; for(let i=bag.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [bag[i],bag[j]]=[bag[j],bag[i]]; }
    const last=ls.get('gyoza.lastclip',null); if(bag.length>1 && bag[0]===last){ [bag[0],bag[1]]=[bag[1],bag[0]]; }
  }
  const c=bag.shift(); ls.set('gyoza.bag',bag); ls.set('gyoza.lastclip',c); return c;
}
// load the next clip ahead of time once I'm close to the threshold, so it starts instantly
function prepareClip(){
  if(clipReady || !CLIPS.length || !me) return;
  if((counts()[me]||0) < FX_MIN-3) return;
  clipReady=nextClip(); if(!clipReady) return;
  // warm the cache with a separate element: never touch CLIP here, it may be playing the current overtake
  try{ const pre=new Audio(); pre.preload='auto'; pre.muted=true; pre.src=clipReady; pre.load(); prepareClip.pre=pre; }catch{}
}
function playClip(){
  if(!CLIPS.length) return false;
  const src=clipReady||nextClip(); clipReady=null; if(!src) return false;
  try{
    if(!CLIP.src.endsWith(src)){ CLIP.src=src; }
    CLIP.currentTime=0; CLIP.volume=1;
    lastPlayErr=''; const p=CLIP.play(); p&&p.catch(e=>{ console.warn('clip play',e); if(e&&e.name==='AbortError') return; lastPlayErr=e&&e.name||'errore'; toast('Il telefono ha bloccato l\'audio: tocca lo schermo e riprova'); try{ if(AC) THEMES[0].play(T()); }catch{} });
    clearTimeout(playClip.t); clearInterval(playClip.f);
    playClip.t=setTimeout(()=>{ // fade out over 0.6s, then stop at 12s
      playClip.f=setInterval(()=>{ CLIP.volume=Math.max(0,CLIP.volume-0.1); if(CLIP.volume<=0.01){ clearInterval(playClip.f); CLIP.pause(); CLIP.volume=1; } },60);
    }, FX_MS-600);
    return true;
  }catch(e){ console.warn(e); return false; }
}

/* synth building blocks */
const T=()=>AC.currentTime+0.05;
function env(node,t,a,peak,d){ const g=AC.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(peak,t+a); g.gain.exponentialRampToValueAtTime(0.0001,t+a+d); node.connect(g); g.connect(MASTER); return g; }
function tone(f,t,d,type='sawtooth',v=.2,cut=2500){ const o=AC.createOscillator(); o.type=type; o.frequency.value=f; const lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=cut; o.connect(lp); env(lp,t,.02,v,d); o.start(t); o.stop(t+d+.1); return o; }
function chord(fs,t,d,v=.12,type='sawtooth'){ fs.forEach(f=>{ tone(f,t,d,type,v); tone(f*1.006,t,d,type,v*.6); }); }
function noise(t,d,v=.3,freq=1000,q=.7,type='bandpass',attack=.01){ const b=AC.createBuffer(1,Math.max(1,AC.sampleRate*d),AC.sampleRate), c=b.getChannelData(0); for(let i=0;i<c.length;i++) c[i]=Math.random()*2-1;
  const src=AC.createBufferSource(); src.buffer=b; const f=AC.createBiquadFilter(); f.type=type; f.frequency.value=freq; f.Q.value=q; src.connect(f); env(f,t,attack,v,d); src.start(t); return src; }
function kick(t,v=.9){ const o=AC.createOscillator(); o.type='sine'; o.frequency.setValueAtTime(150,t); o.frequency.exponentialRampToValueAtTime(40,t+.25); env(o,t,.005,v,.3); o.start(t); o.stop(t+.4); }
function snare(t,v=.4){ noise(t,.18,v,1800,.6); tone(190,t,.08,'triangle',.25); }
function timpani(t,f=73,v=.8){ const o=AC.createOscillator(); o.type='sine'; o.frequency.setValueAtTime(f*1.3,t); o.frequency.exponentialRampToValueAtTime(f,t+.12); env(o,t,.01,v,1.2); o.start(t); o.stop(t+1.4); noise(t,.25,.25,300,.8); }
function crowd(t,d,v=.35){ noise(t,d,v,700,.4,'bandpass',d*.35); noise(t,d,v*.5,1500,.6,'bandpass',d*.5); }
function horn(t,d=.45){ chord([466,587,698],t,d,.11,'sawtooth'); }
function whistle(t,d=.6){ const o=AC.createOscillator(); o.type='sine'; o.frequency.value=2900; const l=AC.createOscillator(), lg=AC.createGain(); l.frequency.value=28; lg.gain.value=180; l.connect(lg); lg.connect(o.frequency); env(o,t,.01,.25,d); o.start(t); o.stop(t+d+.1); l.start(t); l.stop(t+d+.1); }
function engine(t,d=2.2){ const o=AC.createOscillator(), o2=AC.createOscillator(); o.type='sawtooth'; o2.type='square';
  o.frequency.setValueAtTime(90,t); o.frequency.exponentialRampToValueAtTime(520,t+d*.55); o.frequency.exponentialRampToValueAtTime(160,t+d);
  o2.frequency.setValueAtTime(91,t); o2.frequency.exponentialRampToValueAtTime(523,t+d*.55); o2.frequency.exponentialRampToValueAtTime(158,t+d);
  const lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=1400; o.connect(lp); o2.connect(lp); env(lp,t,d*.4,.28,d*.6); o.start(t); o2.start(t); o.stop(t+d+.1); o2.stop(t+d+.1); }
function bell(t){ [880,1320,2210].forEach((f,i)=>tone(f,t,1.6,'sine',.18/(i+1),8000)); }
function arp(notes,t,step=.08,type='square',v=.1){ notes.forEach((f,i)=>tone(f,t+i*step,step*1.6,type,v,6000)); }

/* themes: visuals are the same on every phone, sound + voice only on the overtaker's */
const THEMES=[
  {k:'Telecronaca F1',title:'Sorpasso in pista!',play:t=>{ engine(t,2.4); crowd(t+1.2,2.6,.3); chord([392,494,587],t+2.2,1.2,.1); }, voice:(a,b)=>`Attenzione, ${a} prende la scia... si butta all'interno... e passa! Sorpasso da manuale su ${b}!`},
  {k:'Telecronaca calcio',title:'Che sorpasso!',play:t=>{ whistle(t,.5); crowd(t+.3,3.2,.45); [0,.5,1,1.5].forEach(x=>kick(t+.5+x)); horn(t+2.2,.6); }, voice:(a,b)=>`${a} si accentra, salta ${b}... e va! Che azione, signore e signori, che azione!`},
  {k:'Colonna sonora epica',title:'Leggendario!',play:t=>{ timpani(t); timpani(t+.35,73); timpani(t+.7,82); chord([196,247,294],t+.9,1.1,.12); chord([220,277,330],t+1.9,.9,.12); chord([262,330,392,523],t+2.7,1.8,.13); timpani(t+2.7,65,1); }, voice:(a,b)=>`In un'epoca di gyoza... un solo eroe si è alzato. ${a}. E ${b} non sarà mai più lo stesso.`},
  {k:'Sala giochi',title:'Level up!',play:t=>{ arp([523,659,784,1047,784,1047,1319],t,.07); arp([659,784,988,1319,1568],t+.7,.06); arp([1047,1319,1568,2093],t+1.2,.09,'square',.12); }, voice:(a,b)=>`Nuovo record! ${a} supera ${b}. Inserire un altro gyoza per continuare.`},
  {k:'Ring di boxe',title:'Al tappeto!',play:t=>{ bell(t); bell(t+.45); crowd(t+.5,2.6,.4); [0,.25,.5].forEach(x=>snare(t+.8+x)); kick(t+1.6); }, voice:(a,b)=>`${b} è al tappeto! Uno, due, tre... ${a} è il nuovo campione dei pesi gyoza!`},
  {k:'Edizione straordinaria',title:'Ultim\'ora!',play:t=>{ chord([523,659,784],t,.25,.1,'square'); chord([587,740,880],t+.3,.25,.1,'square'); chord([659,831,988],t+.6,.9,.1,'square'); [0,.15,.3,.45,.6].forEach(x=>snare(t+x,.2)); }, voice:(a,b)=>`Interrompiamo le trasmissioni per una notizia clamorosa: ${a} ha appena superato ${b}. Seguiranno aggiornamenti.`},
  {k:'Tappa di montagna',title:'Scatto in salita!',play:t=>{ crowd(t,3.4,.4); horn(t+.4,.35); horn(t+.9,.35); horn(t+1.4,.8); kick(t+1.4); }, voice:(a,b)=>`Scatto sull'ultima rampa! ${a} si alza sui pedali e stacca ${b}. Il pubblico è in delirio!`},
  {k:'Curva dello stadio',title:'Tutti in piedi!',play:t=>{ [0,.6,1.2,1.8].forEach(x=>{ kick(t+x); snare(t+x+.3); }); horn(t+.1,.3); horn(t+1.3,.3); crowd(t,3.2,.5); }, voice:(a,b)=>`${a}! ${a}! ${a}! Lo stadio canta per lui. ${b}, oggi non è la tua serata.`}
];
function speak(text){
  try{
    if(!window.speechSynthesis) return;
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    const vs=speechSynthesis.getVoices(); const it=vs.find(v=>/^it/i.test(v.lang));
    if(it) u.voice=it; u.lang='it-IT'; u.rate=1.08; u.pitch=1.05; u.volume=1;
    speechSynthesis.speak(u);
  }catch{}
}
try{ window.speechSynthesis?.getVoices(); }catch{}

function checkOvertakes(){
  const now=counts();
  if(prevCounts===null){ if(Object.keys(S.players).length) prevCounts=now; return; }
  for(const a in now){
    const pa=prevCounts[a]??0;
    if(now[a]<FX_MIN || now[a]<=pa) continue;
    const passed=Object.keys(now).filter(b=>b!==a && b in prevCounts && pa<=prevCounts[b] && now[a]>now[b]);
    if(passed.length){ passed.sort((x,y)=>now[y]-now[x]); fxQueue.push({a,bs:passed,n:now[a],seed:Object.keys(S.bites).length}); }
  }
  prevCounts=now;
  runFx();
}
function runFx(){
  if(fxBusy||!fxQueue.length) return;
  const ev=fxQueue.shift(), A=S.players[ev.a], Bs=ev.bs.map(id=>S.players[id]).filter(Boolean);
  if(!A||!Bs.length){ runFx(); return; }
  fxBusy=true;
  const th=THEMES[ev.seed%THEMES.length];
  const bNames = Bs.length===1 ? Bs[0].name : Bs.slice(0,-1).map(x=>x.name).join(', ')+' e '+Bs.at(-1).name;
  const fxEl=document.getElementById('fx');
  const rain=Array.from({length:18},(_,i)=>`<span class="drop" style="left:${(i*53)%100}%;animation-delay:${(i%6)*0.18}s;animation-duration:${1.8+(i%4)*0.35}s">${gyozaSVG({dough:DOUGH[i%DOUGH.length].k,face:FACES[i%FACES.length].k})}</span>`).join('');
  fxEl.innerHTML=`<div class="rain" aria-hidden="true">${rain}</div>
    <div class="fx-card" role="alert"><p class="fx-theme">${esc(th.k)}</p><p class="fx-k">${esc(th.title)}</p>
      <div class="fx-track"><span class="fx-line"></span>
        <div class="fx-run fx-b">${runnerSVG(Bs[0])}<span>${esc(Bs[0].name)}</span></div>
        <div class="fx-run fx-a">${runnerSVG(A)}<span>${esc(A.name)}</span></div></div>
      <p class="fx-t"><b>${esc(A.name)}</b> supera <b>${esc(bNames)}</b></p><p class="fx-s">${ev.n} gyoza e non si ferma</p>
      <button class="btn primary" data-act="fxclose">Continua a mangiare</button></div>`;
  fxEl.hidden=false;
  if(ev.a===me && Date.now()-soundStartedAt>4000){ overtakeSound(th, A.name, bNames); }
  clearTimeout(runFx.t); runFx.t=setTimeout(closeFx, FX_MS);
}
let soundStartedAt=0;
// starts the overtake sound; called straight from the tap so phones never treat it as autoplay
function overtakeSound(th, aName, bNames){
  soundStartedAt=Date.now();
  try{ navigator.vibrate?.([80,40,80,40,240]); }catch{}
  unlockAudio();
  if(!playClip()){
    try{ if(AC){ th.play(T()); } }catch(e){ console.warn(e); }
    setTimeout(()=>speak(th.voice(aName,bNames)), 900);
  }
}
let lastPlayErr='';
function diagnose(){
  const t0=CLIP.currentTime;
  setTimeout(()=>{
    const playing=!CLIP.paused && CLIP.currentTime>t0;
    let msg;
    if(!CLIPS.length) msg='Nessuna clip trovata. Suona la musica di riserva.';
    else if(playing) msg=`La clip sta suonando (${CLIPS.length} clip). Se non senti nulla alza il volume MULTIMEDIA con i tasti laterali mentre sei sulla pagina.`;
    else if(CLIP.error) msg=`Il telefono non riesce a leggere questa clip (errore ${CLIP.error.code}).`;
    else if(lastPlayErr) msg=`Il browser ha bloccato l'audio (${lastPlayErr}). Tocca di nuovo il pulsante.`;
    else msg=`La clip si sta ancora caricando. Riprova tra qualche secondo.`;
    const card=document.querySelector('.fx-card'); if(card){ const p=document.createElement('p'); p.className='fx-diag'; p.textContent=msg; card.insertBefore(p, card.querySelector('button')); }
    else toast(msg);
  },1800);
}
function predictOvertake(){
  const now=counts(); if(!me || !(me in now)) return null;
  const mine=now[me]+1; if(mine<FX_MIN) return null;
  const passed=Object.keys(now).filter(b=>b!==me && now[me]<=now[b] && mine>now[b]);
  return passed.length?passed:null;
}
function closeFx(){ const fxEl=document.getElementById('fx'); fxEl.hidden=true; fxEl.innerHTML=''; fxBusy=false; setTimeout(runFx,300); }

/* ---------- events ---------- */
document.getElementById('brand').addEventListener('click',()=>go('lobby'));
document.addEventListener('click', async e=>{
  const pick=e.target.closest('[data-pick]');
  if(pick){ me=pick.dataset.pick; setMe(me); go('play'); return; }
  const set=e.target.closest('[data-set]');
  if(set){ view.draft[set.dataset.set]=set.dataset.val; refreshEditor(); return; }
  if(e.target.closest('#eat')){ eat(e); return; }
  const tap=e.target.closest('[data-tap]');
  if(tap&&!tap.disabled){ const id=tap.dataset.tap; tap.classList.add('pressed'); setTimeout(()=>tap.classList.remove('pressed'),110);
    try{navigator.vibrate?.(25)}catch{}
    const seat=document.getElementById('seat-'+id); const num=seat?.querySelector('.num'); if(num) num.textContent=(+num.textContent)+1;
    if(seat){ const fl=document.createElement('span'); fl.className='floater'; fl.textContent='+1'; fl.style.left='50%'; fl.style.top='40%'; seat.appendChild(fl); setTimeout(()=>fl.remove(),900); }
    addBite(id); return; }
  const untap=e.target.closest('[data-untap]');
  if(untap&&!untap.disabled){ undoBite(untap.dataset.untap); return; }
  const a=e.target.closest('[data-act]'); if(!a||a.disabled) return;
  const act=a.dataset.act;
  if(act==='new'){
    if(Object.keys(S.players).length>=MAX){ toast('Tavolo pieno: massimo 10 giocatori'); return; }
    const k=Object.keys(S.players).length;
    go('editor',{from:view.name,editId:null,draft:{name:'',dough:DOUGH[k%DOUGH.length].k,face:FACES[k%FACES.length].k,acc:'nessuno',shoes:SHOES[k%SHOES.length].k,photo:null}});
  }
  if(act==='edit'){ UI.menu=false; const p=S.players[me]; go('editor',{editId:me,draft:{...p}}); }
  if(act==='lobby'){ UI.menu=false; go('lobby'); }
  if(act==='play') go('play');
  if(act==='reload') location.reload();
  if(act==='fxclose'){ clearTimeout(runFx.t); closeFx(); }
  if(act==='leave') leaveRoom();
  if(act==='copy'){ const v=shareLink(); try{ await navigator.clipboard.writeText(v); toast('Link copiato'); }catch{ const lb=document.getElementById('linkbox'); lb?.select(); toast('Seleziona il link e copialo'); } }
  if(act==='share'){ try{ await navigator.share({title:'Gyoza Grand Prix',text:'Entra nel Gyoza Grand Prix e segna i tuoi gyoza!',url:shareLink()}); }catch{} }
  if(act==='create'){ const u=normalizeDb(document.getElementById('dburl')?.value); if(!u){ toast('Indirizzo non valido: deve finire con firebasedatabase.app'); return; } CONN={db:u,r:roomCode()}; connect(); }
  if(act==='table') go('table');
  if(act==='finale'){ UI.menu=false; go('finale'); }
  if(act==='full'){ UI.full=!UI.full; render(); }
  if(act==='testfx'){ UI.menu=false;
    const other=Object.keys(S.players).find(id=>id!==me)||me; const seed=Math.floor(Math.random()*THEMES.length);
    overtakeSound(THEMES[seed], S.players[me]?.name||'Tu', S.players[other]?.name||'qualcuno');
    render();
    fxQueue.unshift({a:me,bs:[other],n:counts()[me]||0,seed}); fxBusy=false; runFx();
    diagnose(); return; }
  if(act==='invite'){ if(!CONN) return; const v=shareLink(); if(navigator.share){ try{ await navigator.share({title:'Gyoza Grand Prix',text:'Entra nel Gyoza Grand Prix e segna i tuoi gyoza!',url:v}); }catch{} } else { try{ await navigator.clipboard.writeText(v); toast('Link copiato: mandalo nel gruppo'); }catch{ toast(v); } } return; }
  if(act==='menu'){ UI.menu=!UI.menu; render(); }
  if(act==='nophoto'){ view.draft.photo=null; refreshEditor(); }
  if(act==='save'){
    const d=view.draft; const name=(d.name||'').trim();
    if(!name){ toast('Scrivi un nome per il tuo personaggio'); document.getElementById('nm')?.focus(); return; }
    const taken = Object.entries(S.players).some(([id,p])=>id!==view.editId && p.name.trim().toLowerCase()===name.toLowerCase());
    if(taken){ toast('Questo nome è già al tavolo, scegline un altro'); return; }
    if(!view.editId && Object.keys(S.players).length>=MAX){ toast('Tavolo pieno: massimo 10 giocatori'); return; }
    const id = view.editId || uid();
    const data={name,dough:d.dough,face:d.face,acc:d.acc,shoes:d.shoes||'rosso',photo:d.photo||null,createdAt: view.editId?(S.players[id]?.createdAt||Date.now()):Date.now()};
    a.disabled=true;
    const ok = await putPlayer(id,data);
    if(ok){ const wasEdit=!!view.editId; me=id; setMe(me); go(view.from==='table'?'table':'play'); toast(wasEdit?'Personaggio aggiornato':`Benvenuto al tavolo, ${name}!`); } else a.disabled=false;
  }
  if(act==='undo'){ await undoBite(me); toast('Ultimo gyoza tolto'); }
  if(act==='end'){ await setGame({ended:true,endedAt:Date.now()}); }
  if(act==='reopen'){ await setGame({ended:false}); }
  if(act==='askreset'){ view.confirmReset=true; render(); }
  if(act==='noreset'){ view.confirmReset=false; render(); }
  if(act==='reset'){ await resetAll(); toast('Tavolo pulito, nuova serata!'); }
});
document.addEventListener('input', e=>{
  if(e.target.id==='nm'){ view.draft.name=e.target.value; const pn=document.getElementById('prevName'); if(pn) pn.textContent=e.target.value.trim()||'Senza nome'; }
});
document.addEventListener('change', e=>{
  if(e.target.id!=='ph') return;
  const f=e.target.files?.[0]; if(!f) return;
  const img=new Image(); const url=URL.createObjectURL(f);
  img.onload=()=>{
    const S2=128, c=document.createElement('canvas'); c.width=c.height=S2;
    const s=Math.min(img.width,img.height);
    c.getContext('2d').drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,S2,S2);
    view.draft.photo=c.toDataURL('image/jpeg',0.78); URL.revokeObjectURL(url); refreshEditor();
  };
  img.onerror=()=>{ toast('Non riesco ad aprire questa immagine, provane un\'altra'); URL.revokeObjectURL(url); };
  img.src=url;
});

let busy=false;
async function eat(e){
  const btn=document.getElementById('eat'); if(!btn||btn.disabled) return;
  btn.classList.add('pressed'); setTimeout(()=>btn.classList.remove('pressed'),110);
  try{ navigator.vibrate?.(25); }catch{}
  const card=document.getElementById('meCard');
  const fl=document.createElement('span'); fl.className='floater'; fl.textContent='+1';
  const cr=card.getBoundingClientRect(), br=btn.getBoundingClientRect();
  fl.style.left=(br.left-cr.left+br.width/2)+'px'; fl.style.top=(br.top-cr.top+20)+'px';
  card.appendChild(fl); setTimeout(()=>fl.remove(),900);
  const bc=document.getElementById('bigCount'); if(bc) bc.textContent=(+bc.textContent)+1; // optimistic
  const passed=predictOvertake();
  if(passed){ const th=THEMES[(Object.keys(S.bites).length+1)%THEMES.length]; const names=passed.map(id=>S.players[id]?.name).filter(Boolean); overtakeSound(th, S.players[me].name, names.length>1?names.slice(0,-1).join(', ')+' e '+names.at(-1):names[0]); }
  addBite(me);
}

(function bokeh(){
  // blurred paper parasols: you sense the mood, you don't see the umbrellas
  const cols=['#e5503f','#f2a93b','#f07ab8','#3fb6a8','#8f72e0','#f4d45c','#3f7be5','#ff8a5c'];
  let seed=7; const rnd=()=>{ seed=(seed*9301+49297)%233280; return seed/233280; };
  let g='';
  for(let i=0;i<14;i++){
    const x=rnd()*100, y=rnd()*100, r=60+rnd()*110, c=cols[i%cols.length], c2=cols[(i+3)%cols.length], ribs=10+Math.floor(rnd()*6);
    let wedges='';
    for(let k=0;k<ribs;k++){ const a0=k/ribs*Math.PI*2, a1=(k+1)/ribs*Math.PI*2;
      wedges+=`<path d="M0 0 L${(Math.cos(a0)*r).toFixed(1)} ${(Math.sin(a0)*r).toFixed(1)} A${r} ${r} 0 0 1 ${(Math.cos(a1)*r).toFixed(1)} ${(Math.sin(a1)*r).toFixed(1)} Z" fill="${k%2?c:c2}"/>`; }
    g+=`<g transform="translate(${x*10} ${y*10}) rotate(${(rnd()*360).toFixed(0)}) scale(1 ${(.45+rnd()*.55).toFixed(2)})">${wedges}<circle r="${(r*.12).toFixed(0)}" fill="#fff" opacity=".6"/></g>`;
  }
  document.getElementById('bokeh').innerHTML=`<svg viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid slice">${g}</svg>`;
})();
render();
connect();
